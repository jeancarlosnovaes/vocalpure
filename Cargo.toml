[package]
name = "vocalpure"
version = "0.5.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "VocalPure Rust: local neural voice restoration"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "VocalPure"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = ["nih_plug/standalone", "dep:cpal", "dep:baseview", "dep:egui-baseview"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
nih_plug = { path = "vendor/nih-plug" }
nih_plug_egui = { path = "vendor/nih-plug/nih_plug_egui" }
rustfft = "6.2"
crossbeam = "0.8"
cpal = { version = "0.15", optional = true }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0", optional = true }
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", optional = true }

[build-dependencies]
cc = "1.2"
winresource = "0.1.34"

[workspace]
exclude = ["vendor/nih-plug"]

[profile.release]
lto = "thin"
strip = "symbols"


[patch.crates-io]
cpal = { path = "vendor/cpal" }

[dev-dependencies]
rtrb = "0.2.3"
